services:
  db:
    image: postgres:16-alpine
    container_name: report_field_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-report_field}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-report_field}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - report-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: report_field_api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-report_field}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - report-network

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: report_field_web
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - server
    networks:
      - report-network

volumes:
  pgdata:

networks:
  report-network:
    driver: bridge
